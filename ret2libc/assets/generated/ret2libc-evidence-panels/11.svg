  <text x="96" y="621" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="700">facts</text>
  <text x="96" y="662" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; rbp-0x8 loop counter</text>
<text x="96" y="698" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; final value = 0x64</text>
<text x="96" y="734" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; 0x64 -&gt; d</text>
<text x="96" y="770" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; visible echo artifact only</text>

