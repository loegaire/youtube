  <text x="96" y="168" fill="#7d9d8d" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18">ret2libc: the echo server that leaks its own library</text>

  <rect x="70" y="198" width="650" height="350" rx="6" fill="#07130f" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="252" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">The loop counter is inside the</text>
<text x="96" y="294" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">overflowed region.</text>
<text x="96" y="336" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">After counting to 100, 0x64</text>
<text x="96" y="378" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">appears as ASCII d.</text>

