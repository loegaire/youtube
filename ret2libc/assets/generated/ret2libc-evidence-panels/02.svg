  <text x="1510" y="113" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="25">scene 03 | 00:28</text>
  <text x="96" y="168" fill="#7d9d8d" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18">ret2libc: the echo server that leaks its own library</text>

  <rect x="70" y="198" width="650" height="350" rx="6" fill="#07130f" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="252" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">The workspace gives a binary, a</text>
<text x="96" y="294" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">libc, and a Makefile fragment.</text>
<text x="96" y="336" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">Every later clean card traces back</text>
<text x="96" y="378" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">to these files.</text>

  <rect x="70" y="578" width="650" height="312" rx="6" fill="#091811" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="621" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="700">facts</text>
  <text x="96" y="662" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; vuln: ELF64 executable, not stripped</text>
<text x="96" y="698" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; libc.so.6: ELF64 shared object,</text>
<text x="96" y="734" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; stripped</text>
<text x="96" y="770" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; Makefile.share: build context</text>

