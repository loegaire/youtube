  <text x="878" y="229" fill="#7fffd4" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19">raw evidence / provenance breadcrumb</text>
  <text x="790" y="286" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/00_ls.txt</text>
<text x="790" y="313" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ ls -la</text>
<text x="790" y="340" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">drwxr-xr-x. 1 thinh thinh     104 Jul 25 18:09 ..</text>
<text x="790" y="367" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">-rw-r--r--. 1 thinh thinh     114 Jul 25 18:09 Makefile.share</text>
<text x="790" y="394" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">-rw-r--r--. 1 thinh thinh 2030544 Jul 25 18:09 libc.so.6</text>
<text x="790" y="421" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">-rwxr-xr-x. 1 thinh thinh    8560 Jul 25 18:09 vuln</text>
<text x="790" y="448" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/02_file.txt</text>
<text x="790" y="475" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ file ./vuln ./libc.so.6</text>
<text x="790" y="502" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">./vuln:      ELF 64-bit LSB executable, x86-64, version 1</text>
<text x="790" y="529" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">(SYSV), dynamically linked, interpreter</text>
<text x="790" y="556" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">/lib64/ld-linux-x86-64.so.2, for GNU/Linux 3.2.0,</text>
<text x="790" y="583" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">BuildID[sha1]=e5dba3e6ed29e457cd104accb279e127285eecd0, not</text>
<text x="790" y="610" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">stripped</text>
<text x="790" y="637" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">./libc.so.6: ELF 64-bit LSB shared object, x86-64, version 1</text>
<text x="790" y="664" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">(GNU/Linux), dynamically linked, interpreter</text>
<text x="790" y="691" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">/lib64/ld-linux-x86-64.so.2,</text>
<text x="790" y="718" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">BuildID[sha1]=d3cf764b2f97ac3efe366ddd07ad902fb6928fd7, for</text>
<text x="790" y="745" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">GNU/Linux 3.2.0, stripped</text>
