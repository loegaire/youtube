  <rect x="70" y="66" width="1780" height="78" rx="6" fill="#071b13" stroke="#2d5946" stroke-width="1.5"/>
  <text x="1510" y="113" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="25">scene 05 | 01:18</text>
  <text x="96" y="168" fill="#7d9d8d" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18">ret2libc: the echo server that leaks its own library</text>

  <rect x="70" y="198" width="650" height="350" rx="6" fill="#07130f" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="252" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">readelf proves the hardening</text>
<text x="96" y="294" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">state.</text>
<text x="96" y="336" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">No PIE, NX enabled, no canary,</text>
<text x="96" y="378" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">partial RELRO, RUNPATH ./.</text>

  <rect x="70" y="578" width="650" height="312" rx="6" fill="#091811" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="621" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="700">facts</text>
  <text x="96" y="662" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; NO PIE &lt;- Type: EXEC</text>
<text x="96" y="698" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; NX &lt;- GNU_STACK RW, no E</text>
<text x="96" y="734" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; NO CANARY &lt;- no __stack_chk_fail</text>
<text x="96" y="770" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; PARTIAL RELRO &lt;- GNU_RELRO, no</text>
<text x="96" y="806" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; BIND_NOW</text>

  <rect x="760" y="198" width="1090" height="692" rx="6" fill="#020503" stroke="#2d5946" stroke-width="1.5"/>
  <rect x="760" y="198" width="1090" height="46" rx="6" fill="#0a2117"/>
  <circle cx="790" cy="221" r="7" fill="#ff6f5f"/>
  <circle cx="815" cy="221" r="7" fill="#ffd36e"/>
  <circle cx="840" cy="221" r="7" fill="#7fffd4"/>
  <text x="878" y="229" fill="#7fffd4" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="19">raw evidence / provenance breadcrumb</text>
  <text x="790" y="286" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/03_readelf_header.txt</text>
<text x="790" y="313" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ readelf -h ./vuln</text>
<text x="790" y="340" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  ABI Version:                       0</text>
<text x="790" y="367" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  Type:                              EXEC (Executable file)</text>
<text x="790" y="394" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/04_program_headers.txt</text>
<text x="790" y="421" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ readelf -W -l ./vuln</text>
<text x="790" y="448" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  GNU_EH_FRAME   0x000940 0x0000000000400940</text>
<text x="790" y="475" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">0x0000000000400940 0x00004c 0x00004c R   0x4</text>
<text x="790" y="502" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  GNU_STACK      0x000000 0x0000000000000000</text>
<text x="790" y="529" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">0x0000000000000000 0x000000 0x000000 RW  0x10</text>
<text x="790" y="556" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  GNU_RELRO      0x000e00 0x0000000000600e00</text>
<text x="790" y="583" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">0x0000000000600e00 0x000200 0x000200 R   0x1</text>
<text x="790" y="610" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/05_dynamic.txt</text>
<text x="790" y="637" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ readelf -d ./vuln</text>
<text x="790" y="664" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22"> 0x0000000000000001 (NEEDED)             Shared library:</text>
<text x="790" y="691" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">[libc.so.6]</text>
<text x="790" y="718" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22"> 0x000000000000001d (RUNPATH)            Library runpath: [./]</text>
<text x="790" y="745" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22"> 0x000000000000000c (INIT)               0x400518</text>
<text x="790" y="772" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">evidence/19_canary_check.txt</text>
<text x="790" y="799" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">$ readelf -sW ./vuln | grep __stack_chk_fail || echo &quot;no</text>
<text x="790" y="826" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">__stack_chk_fail symbol&quot;</text>
<text x="790" y="853" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">no __stack_chk_fail symbol</text>
</svg>
