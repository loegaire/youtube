<text x="790" y="340" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">--stop-address=0x400530 ./vuln</text>
<text x="790" y="367" fill="#cdebd9" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="22">  40052a:  48 83 c4 08            add    rsp,0x8</text>
