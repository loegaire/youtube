  <text x="1510" y="113" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="25">scene 15 | 09:00</text>
  <text x="96" y="168" fill="#7d9d8d" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18">ret2libc: the echo server that leaks its own library</text>

  <rect x="70" y="198" width="650" height="350" rx="6" fill="#07130f" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="252" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">The ret at 0x40052e shifts the</text>
<text x="96" y="294" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">stack by one address width.</text>
<text x="96" y="336" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">It is used in stage two for libc</text>
<text x="96" y="378" fill="#d8fbe8" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="30">stack alignment.</text>

  <rect x="70" y="578" width="650" height="312" rx="6" fill="#091811" stroke="#224333" stroke-width="1.5"/>
  <text x="96" y="621" fill="#ffd36e" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="700">facts</text>
  <text x="96" y="662" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; RET = 0x40052e</text>
<text x="96" y="698" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; from _init context</text>
<text x="96" y="734" fill="#e5f7ea" font-family="JetBrains Mono, Fira Code, DejaVu Sans Mono, monospace" font-size="25">&gt; used only in stage two</text>

