        .meter { position:absolute; right:135px; top:290px; width:630px; height:340px; border:2px solid #D8BE73; border-radius:28px; background:#17140feb; padding:36px; } .meter label { color:#D8BE73; font:800 22px 'JetBrains Mono',monospace; } .digits { margin-top:32px; color:#D8BE73; font:800 66px 'JetBrains Mono',monospace; } .track { margin-top:28px; height:24px; border-radius:14px; background:#26384a; overflow:hidden; } .fill { height:100%; width:100%; transform-origin:left; background:#D8BE73; }

      <div id="root" data-composition-id="mechanics-moral" data-width="1920" data-height="1080" data-duration="130">
        <div id="count-stage" class="clip stage" data-start="0" data-duration="35" data-track-index="1"><div class="grid"></div><h2 class="title">%n copies the counter, not your number</h2><p class="sub">The width specifier is counter fuel.</p><div id="count-wrong" class="idea wrong"><span class="idea-line">wrong mental model</span><span class="idea-line muted">keyboard → memory</span><span class="idea-line" style="margin-top:26px">%n writes “0x6761”</span></div><div id="count-right" class="idea right" style="top:574px"><span class="idea-line">correct model</span><span class="idea-line muted">keyboard → printf recipe → output count → memory</span></div><div id="count-meter" class="meter"><label>printed count so far</label><div id="count-digits" class="digits">0 / 0x0000</div><div class="track"><div id="count-fill" class="fill"></div></div><div class="tiny"><span class="orange">%14$26465c</span> pumps to <span class="orange">0x6761</span>, then <span class="orange">%hn</span> copies low 16 bits.</div></div></div>
        <div id="slots-stage" class="clip stage" style="opacity:0" data-start="35" data-duration="30" data-track-index="1"><div class="grid"></div><h2 class="title">positional syntax selects a slot</h2><p class="sub">Without dollars, printf walks sequentially. With dollars, it jumps directly.</p><div id="slots-shelf" class="shelf"><div class="slot"><strong>14</strong>counter character</div><div class="slot"><strong>15</strong>padding</div><div class="slot"><strong>16</strong>padding</div><div class="slot"><strong>17</strong>padding</div><div class="slot"><strong>18</strong>padding</div><div id="slot19" class="slot target"><strong>19</strong>sus + 2</div><div id="slot20" class="slot target"><strong>20</strong>sus + 0</div></div><div id="slots-recipe" class="recipe">%14$26465c &nbsp; %19$hn &nbsp; %14$1285c &nbsp; %20$hn</div></div>
        <div id="scanf-stage" class="clip stage" style="opacity:0" data-start="65" data-duration="25" data-track-index="1"><div class="grid"></div><h2 class="title">scanf("%s") stops at whitespace</h2><p class="sub">Keep input compact. Let printf create the spaces in its output.</p><div id="scanf-code" class="scanf-panel"><span class="cyan">scanf(</span><span class="orange">"%1024s"</span><span class="cyan">, buf);</span><p class="tiny"><span class="idea-line">input: <span class="orange">%14$26465c</span></span><span class="idea-line">literal spaces: none</span></p></div><div id="scanf-wall" class="wall">AAAA <span style="margin-left:28px;color:#F1F3EE">|</span><span style="margin-left:28px;color:#9EA8A0">BBBB</span></div><div id="scanf-fuel" class="recipe" style="bottom:120px">small input → width specifier → huge output count</div></div>
        <div id="moral-stage" class="clip stage" style="opacity:0" data-start="90" data-duration="40" data-track-index="1"><div class="grid"></div><h2 class="title">the moral</h2><p class="sub">printf did not get hacked. It followed the recipe.</p><div class="moral"><div id="moral-safe" class="path safe"><h3 class="right">safe</h3><code class="right">printf("%s", buf);</code><p><span class="idea-line">data → output</span><span class="idea-line right">user input stays data</span></p></div><div id="moral-unsafe" class="path unsafe"><h3 class="wrong">unsafe</h3><code class="wrong">printf(buf);</code><p><span class="idea-line">data → recipe → memory access</span><span class="idea-line wrong">user input became instructions</span></p></div></div><div id="moral-line" class="final-line">Format string bug = <span>user input controls the formatting recipe.</span></div></div>
      </div>
