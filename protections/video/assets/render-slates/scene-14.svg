  <text x="204" y="290" fill="#8CCB9A" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="700">10-exec-probe-rwx-program-headers.txt</text><line x1="98" x2="898" y1="315" y2="315" stroke="#2D4437" stroke-width="3"/>
  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ readelf -W -l bin/exec-probe-rwx</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Elf file type is EXEC (Executable file)</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Entry point 0x401050</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">There are 13 program headers, starting at offset 64</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Program Headers:</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  Type           Offset   VirtAddr           PhysAddr           FileSiz  Me…</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  PHDR           0x000040 0x0000000000400040 0x0000000000400040 0x0002d8 0x…</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  INTERP         0x00035c 0x000000000040035c 0x000000000040035c 0x00001c 0x…</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">      [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x000000 0x0000000000400000 0x0000000000400000 0x000500 0x…</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x001000 0x0000000000401000 0x0000000000401000 0x000199 0x…</text><text x="128" y="616" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x002000 0x0000000000402000 0x0000000000402000 0x000144 0x…</text><text x="128" y="640" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x002148 0x0000000000403148 0x0000000000403148 0x000228 0x…</text><text x="128" y="664" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  DYNAMIC        0x002158 0x0000000000403158 0x0000000000403158 0x0001d0 0x…</text><text x="128" y="688" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x000318 0x0000000000400318 0x0000000000400318 0x000020 0x…</text><text x="128" y="712" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x000338 0x0000000000400338 0x0000000000400338 0x000024 0x…</text><text x="128" y="736" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x002124 0x0000000000402124 0x0000000000402124 0x000020 0x…</text><text x="128" y="760" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_PROPERTY   0x000318 0x0000000000400318 0x0000000000400318 0x000020 0x…</text><text x="128" y="784" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_EH_FRAME   0x002054 0x0000000000402054 0x0000000000402054 0x00002c 0x…</text><text x="128" y="808" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_STACK      0x000000 0x0000000000000000 0x0000000000000000 0x000000 0x…</text></g>
