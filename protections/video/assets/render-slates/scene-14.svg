  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">NX</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">The wider idea is executable-space</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">protection. PaX developed PAGEEXEC</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">and related mechanisms for systems</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">where convenient hardware support</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">was not always available, and its</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">documents describe making stacks,</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">heaps, and anonymous mappings</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">10-exec-probe-rwx-program-he</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">GNU_STACK / PROCESS PAGE</text><rect x="1325" y="380" width="430" height="270" rx="22" fill="#0A1719" stroke="#A7DDE0" stroke-width="4"/><text x="1360" y="435" fill="#F1F3EE" font-family="Inter, sans-serif" font-size="34" font-weight="800">permission is</text><text x="1360" y="476" fill="#F1F3EE" font-family="Inter, sans-serif" font-size="34" font-weight="800">a hardware decision</text><g font-family="JetBrains Mono, monospace" font-size="50" font-weight="800"><rect x="1360" y="530" width="100" height="78" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1391" y="584" fill="#8CCB9A">R</text><rect x="1480" y="530" width="100" height="78" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1510" y="584" fill="#8CCB9A">W</text><rect x="1600" y="530" width="100" height="78" fill="#251412" stroke="#CA6763" stroke-width="3"/><text x="1630" y="584" fill="#CA6763">E</text></g>
