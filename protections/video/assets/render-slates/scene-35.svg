  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">PIE</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">PIE and ASLR are related but not</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">synonymous. PIE is the property that</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">lets the executable operate at</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">different bases. ASLR is the runtime</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">policy that selects a base for a</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">particular execution. A relocatable</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">executable can be placed somewhere</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">31-pie-headers-and-symbols.t</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">RUNTIME MAP / COMPARE RUNS</text><rect x="1325" y="370" width="420" height="58" rx="12" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="408" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">ELF TYPE · DYN</text><rect x="1325" y="444" width="420" height="58" rx="12" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="482" fill="#9B87B4" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">MAIN OFFSET · 0x1189</text><rect x="1325" y="518" width="420" height="58" rx="12" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="556" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">RUN BASE · 0x5594...</text><rect x="1325" y="592" width="420" height="58" rx="12" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="630" fill="#E4CF82" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">BASE + 0x1189</text>
