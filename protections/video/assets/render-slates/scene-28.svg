  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ ./bin/address-nopie --hold</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">pid       1521</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">main      0x401186</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">stack     0x7ffe4a36c354</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">puts-ref  0x401030</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">libc-puts 0x7f704aa9e5a0</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ cat /proc/1521/maps</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00400000-00401000 r--p 00000000 fe:00 3588945                            /m…</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00401000-00402000 r-xp 00001000 fe:00 3588945                            /m…</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00402000-00403000 r--p 00002000 fe:00 3588945                            /m…</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00403000-00404000 r--p 00002000 fe:00 3588945                            /m…</text><text x="128" y="616" fill=