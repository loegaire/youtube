  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">This is the actual map for that held</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">process. The executable begins at</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">`0x00400000`. Its executable page is</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">the next mapping. Libc’s file</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">mapping begins at `0x7f704aa1e000`,</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">and the user stack occupies the</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">high-address range beginning at</text>
