  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">===== relro-none =====</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ objdump -R bin/relro-none | grep &apos;puts@&apos;</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00000000004033a0 R_X86_64_JUMP_SLOT  puts@GLIBC_2.2.5</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ cat /proc/1546/maps  # row containing 0x4033a0</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00403000-00404000 rw-p 00002000 fe:00 3588947                            /m…</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: entered main</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: before first puts</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: after first puts</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">hello from puts</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">===== relro-partial =====</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ objdump -R bin/relro-partial | grep &apos;puts@&apos;</text><text x="128" y="616" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">0000000000404000 R_X86_64_JUMP_SLOT  puts@GLIBC_2.2.5</text><text x="128" y="640" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ cat /proc/1548/maps  # row containing 0x404000</text><text x="128" y="664" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">00404000-00405000 rw-p 00003000 fe:00 3588948                            /m…</text><text x="128" y="688" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: entered main</text><text x="128" y="712" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: before first puts</text><text x="128" y="736" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">PROGRAM: after first puts</text><text x="128" y="760" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">hello from puts</text><text x="128" y="784" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">===== relro-full =====</text><text x="128" y="808" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ objdump -R bin/relro-full | grep &apos;puts@&apos;</text></g>
