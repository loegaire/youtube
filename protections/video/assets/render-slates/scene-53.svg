  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">SUMMARY</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">Today we did not begin with five</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">floating shields and assign them</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">magical powers. We followed real</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">source into real binaries, inspected</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">their headers and instructions, ran</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">them, read their live mappings, and</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">then built the diagrams from that</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">41-relro-runtime-pages.txt</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">DEFENSE-IN-DEPTH / EVIDENCE MAP</text><line x1="1325" x2="1755" y1="390" y2="390" stroke="#2D4437" stroke-width="3"/><text x="1330" y="431" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">01</text><text x="1400" y="431" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">NX · no execute page</text><line x1="1325" x2="1755" y1="458" y2="458" stroke="#2D4437" stroke-width="3"/><text x="1330" y="499" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">02</text><text x="1400" y="499" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">CANARY · guard checked</text><line x1="1325" x2="1755" y1="526" y2="526" stroke="#2D4437" stroke-width="3"/><text x="1330" y="567" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">03</text><text x="1400" y="567" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">ASLR · regions vary</text><line x1="1325" x2="1755" y1="594" y2="594" stroke="#2D4437" stroke-width="3"/><text x="1330" y="635" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">04</text><text x="1400" y="635" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">PIE · randomized main</text><line x1="1325" x2="1755" y1="662" y2="662" stroke="#2D4437" stroke-width="3"/><text x="1330" y="703" fill="#8CCB9A" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">05</text><text x="1400" y="703" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">RELRO · locked relocation</text>
