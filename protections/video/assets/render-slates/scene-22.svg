  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">CANARY</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">The canary does not stop the write.</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">The first thirty-two bytes occupy</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">the declared array. More bytes</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">continue through adjacent frame</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">storage. Eventually the stream</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">overwrites the saved guard, then can</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">continue toward saved `rbp` and the</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">20-vuln-canary-greet-disasse</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">STACK MODEL / CONTROL FLOW</text><rect x="1370" y="370" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="408" fill="#9B87B4" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">RETURN ADDRESS</text><rect x="1370" y="436" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="474" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">SAVED RBP</text><rect x="1370" y="502" width="350" height="58" rx="8" fill="#2D2918" stroke="#2D4437" stroke-width="3"/><text x="1400" y="540" fill="#E4CF82" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">TLS GUARD COPY</text><rect x="1370" y="568" width="350" height="58" rx="8" fill="#251412" stroke="#2D4437" stroke-width="3"/><text x="1400" y="606" fill="#CA6763" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">input crosses here</text><rect x="1370" y="634" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="672" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">name[32]</text><path d="M1340 370V692" stroke="#E4CF82" stroke-width="4"/><text x="1280" y="350" fill="#E4CF82" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">32 bytes</text>
