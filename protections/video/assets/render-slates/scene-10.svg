  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">STACK</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">Now the diagram has a provenance.</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">`sub rsp,0x30` gives the local frame</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">area. `rbp minus 0x30` locates the</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">first byte of `name`. The saved</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">frame pointer and return address sit</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">above the current frame. This is</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">still a reconstruction—we did not</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">20-vuln-plain-greet-disassem</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">STACK MODEL / CONTROL FLOW</text><rect x="1370" y="370" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="408" fill="#9B87B4" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">RETURN ADDRESS</text><rect x="1370" y="436" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="474" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">SAVED RBP</text><rect x="1370" y="502" width="350" height="58" rx="8" fill="#251412" stroke="#2D4437" stroke-width="3"/><text x="1400" y="540" fill="#CA6763" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">bytes 32..127</text><rect x="1370" y="568" width="350" height="58" rx="8" fill="#0B1410" stroke="#2D4437" stroke-width="3"/><text x="1400" y="606" fill="#F1F3EE" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">name[32]</text><path d="M1340 370V626" stroke="#E4CF82" stroke-width="4"/><text x="1280" y="350" fill="#E4CF82" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">32 bytes</text>
