  <text x="204" y="290" fill="#8CCB9A" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="700">20-vuln-plain-greet-disassembly.txt</text><line x1="98" x2="898" y1="315" y2="315" stroke="#2D4437" stroke-width="3"/>
  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ objdump -d -M intel -S --disassemble=greet bin/vuln-plain</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">/mnt/data/binary-defenses-lab/bin/vuln-plain:     file format elf64-x86-64</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Disassembly of section .init:</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Disassembly of section .plt:</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Disassembly of section .text:</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">0000000000401156 &lt;greet&gt;:</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">#include &lt;stdio.h&gt;</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">#include &lt;unistd.h&gt;</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">__attribute__((noinline))</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">static void greet(void) {</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  401156:	55                   	push   rbp</text><text x="128" y="616" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  401157:	48 89 e5             	mov    rbp,rsp</text><text x="128" y="640" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  40115a:	48 83 ec 30          	sub    rsp,0x30</text><text x="128" y="664" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">    char name[32];</text><text x="128" y="688" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">    puts(&quot;name:&quot;);</text><text x="128" y="712" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  40115e:	bf 04 20 40 00       	mov    edi,0x402004</text><text x="128" y="736" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  401163:	e8 c8 fe ff ff       	call   401030 &lt;puts@plt&gt;</text><text x="128" y="760" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">    ssize_t count = read(STDIN_FILENO, name, 128);</text><text x="128" y="784" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  401168:	48 8d 45 d0          	lea    rax,[rbp-0x30]</text><text x="128" y="808" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  40116c:	ba 80 00 00 00       	mov    edx,0x80</text></g>
