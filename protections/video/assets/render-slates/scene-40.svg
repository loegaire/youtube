  <text x="204" y="290" fill="#8CCB9A" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="700">40-relro-full-elf-context.txt</text><line x1="98" x2="898" y1="315" y2="315" stroke="#2D4437" stroke-width="3"/>
  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ readelf -W -l bin/relro-full</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Elf file type is EXEC (Executable file)</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Entry point 0x401060</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">There are 14 program headers, starting at offset 64</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">Program Headers:</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  Type           Offset   VirtAddr           PhysAddr           FileSiz  Me…</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  PHDR           0x000040 0x0000000000400040 0x0000000000400040 0x000310 0x…</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  INTERP         0x000394 0x0000000000400394 0x0000000000400394 0x00001c 0x…</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">      [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x000000 0x0000000000400000 0x0000000000400000 0x000568 0x…</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x001000 0x0000000000401000 0x0000000000401000 0x0001c5 0x…</text><text x="128" y="616" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x002000 0x0000000000402000 0x0000000000402000 0x000194 0x…</text><text x="128" y="640" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  LOAD           0x002dc0 0x0000000000403dc0 0x0000000000403dc0 0x000250 0x…</text><text x="128" y="664" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  DYNAMIC        0x002dd0 0x0000000000403dd0 0x0000000000403dd0 0x0001f0 0x…</text><text x="128" y="688" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x000350 0x0000000000400350 0x0000000000400350 0x000020 0x…</text><text x="128" y="712" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x000370 0x0000000000400370 0x0000000000400370 0x000024 0x…</text><text x="128" y="736" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  NOTE           0x002174 0x0000000000402174 0x0000000000402174 0x000020 0x…</text><text x="128" y="760" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_PROPERTY   0x000350 0x0000000000400350 0x0000000000400350 0x000020 0x…</text><text x="128" y="784" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_EH_FRAME   0x00207c 0x000000000040207c 0x000000000040207c 0x000034 0x…</text><text x="128" y="808" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">  GNU_STACK      0x000000 0x0000000000000000 0x0000000000000000 0x000000 0x…</text></g>
