  <line x1="940" x2="940" y1="274" y2="864" stroke="#2D4437" stroke-width="3"/>
  <text x="966" y="305" fill="#A2ADA5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" letter-spacing="2">ESTABLISH → OPERATE → CONSEQUENCE</text>
  <text x="966" y="358" fill="#F1F3EE" font-family="Inter, DejaVu Sans, sans-serif" font-size="39" font-weight="800">RELRO</text>
  <text x="966" y="404" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">RELRO cannot be understood from one</text><text x="966" y="432" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">green label. For each binary, we</text><text x="966" y="460" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">record program headers, the dynamic</text><text x="966" y="488" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">section, relocation records, and</text><text x="966" y="516" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">section headers. No RELRO has no</text><text x="966" y="544" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">`GNU_RELRO` segment. Partial RELRO</text><text x="966" y="572" fill="#A2ADA5" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="500">has one beginning at `0x403df8`, but</text>
  <rect x="966" y="670" width="294" height="70" rx="12" fill="#0A1310" stroke="#2D4437" stroke-width="3"/><text x="988" y="714" fill="#A7DDE0" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">40-relro-full-elf-context.tx</text>
  <text x="1330" y="325" fill="#A2ADA5" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700">GOT / RELOCATION PAGE</text><g font-family="JetBrains Mono, monospace" font-size="18" font-weight="700"><rect x="1325" y="380" width="430" height="66" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="421" fill="#F1F3EE">puts@GOT</text><text x="1500" y="421" fill="#F1F3EE">0x403fd8</text><text x="1660" y="421" fill="#8CCB9A">r--p</text><rect x="1325" y="465" width="430" height="66" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="506" fill="#F1F3EE">startup binding</text><text x="1660" y="506" fill="#8CCB9A">NOW</text><rect x="1325" y="550" width="430" height="66" fill="#142019" stroke="#2D4437" stroke-width="3"/><text x="1350" y="591" fill="#F1F3EE">loader route</text><text x="1660" y="591" fill="#CA6763">late?</text></g>
