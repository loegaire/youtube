  <g clip-path="url(#evidence-clip)"><text x="128" y="352" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ python3 -c &apos;import sys; sys.stdout.buffer.write(b&quot;A&quot;*96)&apos; | ./bin/vuln-plain</text><text x="128" y="376" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">name:</text><text x="128" y="400" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">read 96 bytes</text><text x="128" y="424" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">terminated_by_signal=11</text><text x="128" y="448" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">shell_status=139</text><text x="128" y="472" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ python3 -c &apos;import sys; sys.stdout.buffer.write(b&quot;A&quot;*96)&apos; | ./bin/vuln-ca…</text><text x="128" y="496" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">name:</text><text x="128" y="520" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">read 96 bytes</text><text x="128" y="544" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">*** stack smashing detected ***: terminated</text><text x="128" y="568" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">terminated_by_signal=6</text><text x="128" y="592" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">shell_status=134</text><text x="128" y="616" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">$ python3 -c &apos;import sys; sys.stdout.buffer.write(b&quot;A&quot;*96)&apos; | ./bin/vuln-full</text><text x="128" y="640" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">name:</text><text x="128" y="664" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">read 96 bytes</text><text x="128" y="688" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">*** stack smashing detected ***: terminated</text><text x="128" y="712" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">terminated_by_signal=6</text><text x="128" y="736" fill="#D9E5DD" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="500">shell_status=134</text></g>
